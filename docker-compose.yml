# Local dev Postgres for HantsLocal. Production points at Contabo instead.
#   docker compose up -d   →  postgres on localhost:5432
services:
  postgres:
    image: postgres:16
    container_name: hantslocal-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: hantslocal
      POSTGRES_PASSWORD: hantslocal
      POSTGRES_DB: hantslocal
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hantslocal -d hantslocal"]
      interval: 5s
      timeout: 5s
      retries: 10
